name: Generate and Deploy Dashboard

on:
  schedule:
    - cron: '0 4 * * *' # Esegue la generazione ogni giorno alle 04:00 UTC
  workflow_dispatch: # Permette l'esecuzione manuale dalla tab "Actions"

# Permessi necessari per pubblicare su GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Esegui lo script per generare l'HTML
        run: |
          python main.py # <-- SOSTITUISCI con il nome esatto del tuo script Python

      - name: Carica artefatto per GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Se lo script genera index.html nella root del repo usa '.'
          # Se lo salva in una cartella specifica (es. dist o output), metti './dist'
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
